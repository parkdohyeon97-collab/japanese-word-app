<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>일본어 음성 확인</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: #171819;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    p {
      color: #b7b7b7;
      line-height: 1.6;
    }

    #reloadButton {
      width: 100%;
      padding: 16px;
      margin: 12px 0 22px;
      border: none;
      border-radius: 12px;
      background: #3f99a6;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .voice-card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid #444;
      border-radius: 14px;
      background: #242628;
    }

    .voice-name {
      margin-bottom: 7px;
      font-size: 19px;
      font-weight: bold;
    }

    .voice-info {
      margin-bottom: 13px;
      color: #aaa;
      font-size: 14px;
    }

    .test-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #315f64;
      color: white;
      font-size: 17px;
    }

    .message {
      padding: 20px;
      border: 1px dashed #555;
      border-radius: 12px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>일본어 음성 확인</h1>

  <p>
    아래 목소리를 하나씩 눌러 들어봐.<br>
    마음에 드는 남성 목소리의 이름을 기억하거나 캡처하면 돼.
  </p>

  <button id="reloadButton" type="button">
    음성 목록 다시 불러오기
  </button>

  <div id="voiceList"></div>

  <script>
    const voiceList =
      document.getElementById("voiceList");

    const reloadButton =
      document.getElementById("reloadButton");

    let japaneseVoices = [];

    function speakWithVoice(voice) {
      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          "今日はいい天気だね"
        );

      speech.voice = voice;
      speech.lang = voice.lang || "ja-JP";
      speech.rate = 0.85;
      speech.pitch = 1;

      window.speechSynthesis.speak(speech);
    }

    function loadVoices() {
      const allVoices =
        window.speechSynthesis.getVoices();

      japaneseVoices = allVoices.filter(
        function (voice) {
          return voice.lang
            .toLowerCase()
            .startsWith("ja");
        }
      );

      voiceList.innerHTML = "";

      if (japaneseVoices.length === 0) {
        voiceList.innerHTML = `
          <div class="message">
            일본어 음성을 아직 불러오지 못했습니다.<br><br>
            위의 '음성 목록 다시 불러오기'를
            한두 번 더 눌러주세요.
          </div>
        `;

        return;
      }

      japaneseVoices.forEach(
        function (voice, index) {
          const card =
            document.createElement("div");

          card.className = "voice-card";

          card.innerHTML = `
            <div class="voice-name">
              ${index + 1}. ${voice.name}
            </div>

            <div class="voice-info">
              언어: ${voice.lang}<br>
              기본 음성: ${voice.default ? "예" : "아니오"}<br>
              기기 내장: ${voice.localService ? "예" : "아니오"}
            </div>

            <button
              class="test-button"
              type="button"
            >
              이 목소리 들어보기
            </button>
          `;

          const testButton =
            card.querySelector(".test-button");

          testButton.addEventListener(
            "click",
            function () {
              speakWithVoice(voice);
            }
          );

          voiceList.appendChild(card);
        }
      );
    }

    reloadButton.addEventListener(
      "click",
      loadVoices
    );

    window.speechSynthesis.addEventListener(
      "voiceschanged",
      loadVoices
    );

    loadVoices();

    setTimeout(loadVoices, 500);
    setTimeout(loadVoices, 1500);
  </script>
</body>
</html>
